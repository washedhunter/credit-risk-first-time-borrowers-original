[project]
name = "credit-risk-first-time-borrowers"
version = "0.1.0"
description = "Loan-default model on the Home Credit dataset with a cost-tuned approval threshold, SHAP reason codes, a FastAPI service and a Streamlit dashboard for loan officers."
readme = "README.md"
license = "MIT"
authors = [{ name = "Kaif Attarwala" }]
requires-python = ">=3.12,<3.13"
# Core = what scoring needs (the API image installs only this + the `api` extra).
dependencies = [
    "numpy>=2.5,<3",
    "pandas>=3.1,<4",
    "lightgbm>=4.7,<5",
    "pydantic>=2.14,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.162", "uvicorn>=0.54"]
dashboard = ["streamlit>=1.67,<2", "httpx>=0.28", "plotly>=7.1,<8"]
train = [
    "scikit-learn>=1.9,<2",
    "scipy>=1.18",  # synth.py (also a lightgbm dependency)
    "shap>=0.54,<0.55",
    "optuna>=5.0,<6",
    "matplotlib>=3.11,<4",
    "pyarrow>=26",
    "typer>=0.29",
    "kaggle>=2.2,<3",
    "six>=1.16",  # kaggle 2.2.x imports six but doesn't declare it
]

[project.scripts]
credit-risk = "credit_risk.cli:app"

[dependency-groups]
dev = ["pytest>=9.2", "pytest-cov>=7.1", "ruff>=0.17", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end training run on fake data (~1 min)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
